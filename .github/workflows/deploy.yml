name: SQL promotion

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire demo, including approval waits, because QA is shared.
# This is a single-presenter demo, not a multi-team deployment queue.
concurrency:
  group: sql-promotion-demo
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  qa:
    needs: checks
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    environment: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: PROMOTION_CI_QA
      SNOWFLAKE_ROLE: PROMOTION_DEPLOY_QA
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - uses: snowflakedb/snowflake-actions@1160898243c351349621a6c2bac2e455ab1077b2
        with:
          use-oidc: true
          cli-version: '3.17.1'
      - run: bash ci/deploy.sh QA "$DEPLOY_SHA" --execute

  qa-verified:
    needs: [checks, qa]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require actual QA validation
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          QA_RESULT: ${{ needs.qa.result }}
        run: test "$CHECKS_RESULT" = success && test "$QA_RESULT" = success

  prod:
    needs: qa
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: PROMOTION_CI_PROD
      SNOWFLAKE_ROLE: PROMOTION_DEPLOY_PROD
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - uses: snowflakedb/snowflake-actions@1160898243c351349621a6c2bac2e455ab1077b2
        with:
          use-oidc: true
          cli-version: '3.17.1'
      - name: Reject a stale release before account writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$DEPLOY_SHA"
      - run: bash ci/deploy.sh PROD "$DEPLOY_SHA" --execute